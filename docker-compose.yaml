services:
  app:
    build: .
    image: navdeepmk_docker_test
    ports:
      - "3000:5000"
    links:
      - db
    environment:
    - MONGO_HOST=db
    - MONGO_PORT=27017
    - MONGO_USERNAME=admin
    - MONGO_PASSWORD=password
    - MONGO_INITDB_DATABASE=camp2016
  db:
    image: mongo:latest
    hostname: docker_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data: