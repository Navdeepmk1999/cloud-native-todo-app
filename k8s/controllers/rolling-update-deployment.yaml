apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: kube-system
  labels:
    app: flask-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1  
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask-app
          image: navdeepmk/navdeepmk_docker_test:v2
          ports:
            - containerPort: 5000
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "250Mi"
              cpu: "200m"
          env:
            - name: MONGO_HOST
              value: mongo.kube-system.svc.cluster.local          # MongoDB service name as host
            - name: MONGO_PORT
              value: "27017"            # Port MongoDB is listening on
            - name: FLASK_ENV
              value: "production"       # Flask environment
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: kube-system
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5000
  selector:
    app: flask