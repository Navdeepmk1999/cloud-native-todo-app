apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: kube-system
  labels:
    app: flask-app
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask-app
          image: navdeepmk/navdeepmk_docker_test:v3  # Update image to match your Docker registry
          ports:
            - containerPort: 5000
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10         # Delay before the first probe
            periodSeconds: 15               # Check every 15 seconds
            timeoutSeconds: 2               # Probe times out after 2 seconds
            failureThreshold: 3            
          readinessProbe:
            httpGet:
              path: /readiness
              port: 5000
            initialDelaySeconds: 5          # Delay before readiness checks begin
            periodSeconds: 10               # Check every 10 seconds
            timeoutSeconds: 1               # Probe times out after 1 second
            failureThreshold: 3             # After 3 failures, pod is marked unavailable
          resources:
            requests:
              memory: "100Mi"
              cpu: "100m"
            limits:
              memory: "250Mi"
              cpu: "200m"
          env:
            - name: MONGO_HOST
              value: mongo.kube-system.svc.cluster.local  # MongoDB service name as host
            - name: MONGO_PORT
              value: "27017"                              # MongoDB listening port
            - name: FLASK_ENV
              value: "production"                         # Flask environment

---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
  namespace: kube-system
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 5000
  selector:
    app: flask
