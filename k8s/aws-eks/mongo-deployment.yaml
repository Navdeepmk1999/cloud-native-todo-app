apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: kube-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      containers:
        - name: mongo
          image: mongo:latest
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-persistent-storage
              mountPath: /data/db
          resources:
            requests:
              memory: "50Mi"
              cpu: "50m"
            limits:
              memory: "100Mi"
              cpu: "100m"
      volumes:
        - name: mongo-persistent-storage
          persistentVolumeClaim:
            claimName: mongo-pvc  # Corrected typo here

---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: mongo-pv
  namespace: kube-system
spec:
  capacity:
    storage: 2Gi  # This is the limit for the persistent storage
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /mnt/data/mongo  # Specify path on the host machine for local storage

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-pvc
  namespace: kube-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi  # This is the requested storage (smaller than the PV limit)

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: kube-system
  labels:
    app: mongo
spec:
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
  selector:
    app: mongo
