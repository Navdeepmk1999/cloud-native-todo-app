apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: flask
  template:
    metadata:
      labels:
        app: flask
    spec:
      containers:
        - name: flask-app
          image: navdeepmk/navdeepmk_docker_test
          ports:
            - containerPort: 5000
          env:
            - name: MONGO_HOST
              value: mongo           # MongoDB service name as host
            - name: MONGO_PORT
              value: "27017"            # Port MongoDB is listening on
            # - name: MONGO_USERNAME
            #   value: "admin"            # MongoDB username
            # - name: MONGO_PASSWORD
            #   value: "password"         # MongoDB password
            - name: FLASK_ENV
              value: "production"       # Flask environment
---
apiVersion: v1
kind: Service
metadata:
  name: flask-service
spec:
  type: NodePort
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30007
  selector:
    app: flask